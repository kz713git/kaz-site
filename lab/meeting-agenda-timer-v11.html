
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Agenda Timer</title>
  <style>
    :root {
      --bg-color: #121316;
      --card-bg: #1c1e24;
      --card-active: #222733;
      --text-main: #f0f2f5;
      --text-sub: #9ca3af;
      --bar-normal: #10b981;
      --bar-remind: #f59e0b;
      --bar-over: #ef4444;
      --bar-overall: #3b82f6;
      --border-color: #2e333d;
      --font-mono: "Consolas", "Courier New", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 10px;
      min-width: 280px;
      max-width: 440px;
      margin: 0 auto;
      user-select: none;
    }

    header {
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .title-area {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    h1 {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-sub);
    }

    .copyright {
      font-size: 10px;
      color: #6b7280;
      font-family: var(--font-mono);
      font-weight: 500;
    }

    .key-guide {
      font-size: 10px;
      color: #6b7280;
      font-family: var(--font-mono);
    }

    /* Overall Meeting Tracker */
    .overall-tracker {
      background: #17191e;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .limit-control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-sub);
    }
    .limit-slider-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .limit-slider-wrap input[type=range] {
      width: 90px;
      height: 4px;
      accent-color: #3b82f6;
      cursor: pointer;
    }

    .overall-stats {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-sub);
    }
    .overall-stats span b {
      color: var(--text-main);
    }

    .warning-text {
      color: var(--bar-over) !important;
      font-weight: 700;
    }

    .overall-bar-wrap {
      position: relative;
      height: 14px;
    }

    .planned-marker {
      position: absolute;
      top: -2px;
      bottom: -2px;
      width: 2px;
      background: #ef4444;
      box-shadow: 0 0 5px rgba(239, 68, 68, 0.8);
      z-index: 10;
      display: none;
    }

    .planned-marker::after {
      content: 'LIMIT';
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 8px;
      font-family: var(--font-mono);
      color: #ef4444;
      font-weight: 700;
    }

    .global-controls {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .lang-switch-group {
      display: inline-flex;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      overflow: hidden;
      background: #121316;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 4px 7px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 0;
      transition: all 0.15s ease;
    }

    .lang-btn.active {
      background: #2563eb;
      color: #ffffff;
    }

    /* Compact Slider Controls */
    .mini-control {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #17191e;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 10px;
      color: var(--text-sub);
    }
    .mini-control input[type=range] {
      width: 38px;
      height: 3px;
      accent-color: #3b82f6;
      cursor: pointer;
    }
    .mini-control.duration-ctrl input[type=range] {
      accent-color: #f59e0b;
    }
    .mini-control span.val {
      font-family: var(--font-mono);
      color: var(--text-main);
      font-size: 9px;
      width: 16px;
      text-align: right;
    }

    .tts-settings {
      display: flex;
      gap: 5px;
      align-items: center;
      background: #17191e;
      padding: 5px 8px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      width: 100%;
      margin-top: 4px;
    }

    select {
      background: #121316;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      font-size: 11px;
      padding: 2px 4px;
      border-radius: 3px;
      flex: 1;
      max-width: 220px;
      outline: none;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: #2b303c;
      color: var(--text-main);
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      transition: all 0.15s ease;
    }
    button:hover { background: #3b4252; }
    button:active { transform: translateY(1px); }
    button.primary { background: #2563eb; border-color: #3b82f6; }
    button.primary:hover { background: #1d4ed8; }
    button.danger { background: #b91c1c; border-color: #ef4444; }
    button.success { background: #059669; border-color: #10b981; }
    button.success:hover { background: #047857; }

    .tts-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-sub);
      cursor: pointer;
    }

    .timer-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .timer-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .timer-card.active {
      background: var(--card-active);
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px #3b82f6;
    }

    .card-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .speaker-meta {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .speaker-name {
      font-size: 13px;
      font-weight: 600;
      background: transparent;
      border: none;
      border-bottom: 1px dashed var(--border-color);
      color: var(--text-main);
      width: 110px;
      padding: 1px 3px;
      user-select: text;
    }
    .speaker-name:focus {
      outline: none;
      border-bottom: 1px solid #3b82f6;
      background: #121316;
    }

    .trimmed-badge {
      font-size: 9px;
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 1px 4px;
      border-radius: 3px;
      font-family: var(--font-mono);
      font-weight: 600;
      display: none;
    }

    /* Sliders Panel (Card level) */
    .sliders-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #14161a;
      padding: 5px 6px;
      border-radius: 4px;
      border: 1px solid #232730;
      font-size: 10px;
      color: var(--text-sub);
      width: 100%;
      min-width: 0;
    }

    .slider-item {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .slider-item label {
      font-weight: 600;
      font-size: 10px;
      color: var(--text-sub);
      flex-shrink: 0;
    }

    .slider-item input[type=range] {
      flex: 1 1 auto;
      min-width: 0;
      width: 100%;
      height: 4px;
      accent-color: #10b981;
      cursor: pointer;
    }
    .slider-item.alert-slider input[type=range] {
      accent-color: #f59e0b;
    }

    .slider-item span.val {
      font-family: var(--font-mono);
      color: var(--text-main);
      font-weight: 600;
      font-size: 10px;
      width: 26px;
      text-align: right;
      flex-shrink: 0;
    }

    .card-row-mid {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .time-display {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .time-display.over {
      color: var(--bar-over);
    }

    .card-actions {
      display: flex;
      gap: 4px;
    }

    /* King Jim-style Progress Bar */
    .bar-container {
      width: 100%;
      height: 12px;
      background: #121316;
      border-radius: 3px;
      border: 1px solid #232730;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      background: var(--bar-normal);
      transition: width 0.25s linear, background-color 0.3s ease;
      border-radius: 2px;
    }

    .bar-fill.remind { background: var(--bar-remind); }
    .bar-fill.over { background: var(--bar-over); }
    .bar-fill.overall { background: var(--bar-overall); }
    .bar-fill.overall-over { background: var(--bar-over); }

    .btn-del {
      background: transparent;
      border: none;
      color: #6b7280;
      font-size: 14px;
      padding: 1px 4px;
    }
    .btn-del:hover { color: #ef4444; }

    /* Summary Log Section */
    .log-panel {
      margin-top: 12px;
      background: #17191e;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 10px;
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .log-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .log-content {
      font-family: var(--font-mono);
      font-size: 10px;
      color: #cbd5e1;
      white-space: pre-wrap;
      background: #121316;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #232730;
      line-height: 1.4;
      user-select: text;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="title-area">
        <h1>Meeting Timer</h1>
        <span class="copyright">(c)K.Igeta</span>
      </div>
      <div class="key-guide">[Space] Pause/Play | [Enter] Next</div>
    </div>

    <!-- Overall Meeting Tracker -->
    <div class="overall-tracker">
      <div class="limit-control-row">
        <span>Meeting Limit: <b id="meetingLimitLabel">30m</b></span>
        <div class="limit-slider-wrap">
          <input type="range" id="meetingLimitSlider" min="5" max="180" step="5" value="30" oninput="updateMeetingLimit(this.value)">
        </div>
      </div>
      <div class="overall-stats">
        <span>Plan: <b id="plannedMeetingTime">00:00</b></span>
        <span>Elapsed: <b id="elapsedMeetingTime">00:00</b></span>
        <span>Est: <b id="estMeetingTime">00:00</b></span>
      </div>
      <div class="bar-container overall-bar-wrap">
        <div class="bar-fill overall" id="overallBar" style="width: 0%;"></div>
        <div class="planned-marker" id="plannedMarker"></div>
      </div>
    </div>

    <div class="global-controls">
      <button class="primary" onclick="addTimer()">+ Add Slot</button>
      <button onclick="stopAll()">Stop All</button>
      <button class="success" onclick="finishMeetingManually()" title="Finish meeting and generate time log">🏁 Finish</button>
      <button onclick="openMiniWindow()" title="Pop out a lightweight mini-window preserving active state">Pop-out ⧉</button>
      
      <!-- J / E Language Toggle -->
      <div class="lang-switch-group" title="Announcement Language (J: Japanese / E: English)">
        <button id="langJ" class="lang-btn" onclick="setLanguage('ja')">J</button>
        <button id="langE" class="lang-btn active" onclick="setLanguage('en')">E</button>
      </div>

      <!-- All Reset Button -->
      <button onclick="resetAllTimers()" title="Reset all timers back to original configured durations">All Reset</button>

      <!-- Beep Sound Test Button -->
      <button onclick="testBeepSound()" title="Test authentic CASIO piezo beep sound">♪ Beep</button>

      <!-- Mini Volume Slider -->
      <div class="mini-control" title="Master Beep Volume">
        <span>🔊</span>
        <input type="range" id="volSlider" min="0" max="1" step="0.05" value="0.5" oninput="updateMasterVolume(this.value)">
      </div>

      <!-- Mini Beep Duration Slider -->
      <div class="mini-control duration-ctrl" title="Beep Duration Multiplier (Default 2x)">
        <span>⏱</span>
        <input type="range" id="durSlider" min="0.5" max="4" step="0.5" value="2" oninput="updateBeepDuration(this.value)">
        <span class="val" id="durVal">2x</span>
      </div>
    </div>

    <!-- Voice Settings -->
    <div class="tts-settings">
      <label class="tts-toggle">
        <input type="checkbox" id="ttsToggle" checked> Voice:
      </label>
      <select id="voiceSelect"></select>
      <button onclick="testVoice()">Test</button>
    </div>
  </header>

  <div class="timer-list" id="timerList"></div>

  <!-- End of Meeting Log Panel -->
  <div class="log-panel" id="logPanel">
    <div class="log-header">
      <span class="log-title">Meeting Actuals Log</span>
      <button id="btnCopyLog" onclick="copyLog()">Copy</button>
    </div>
    <div class="log-content" id="logContent"></div>
  </div>

  <script>
    // --- 1. Authentic CASIO Piezo Audio Engine with Scalable Duration ---
    let audioCtx = null;
    let masterGainNode = null;
    let piezoFilter = null;
    let currentVolume = 0.5;
    let beepDurationMultiplier = 2.0; // Default 2x

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        piezoFilter = audioCtx.createBiquadFilter();
        piezoFilter.type = 'bandpass';
        piezoFilter.frequency.setValueAtTime(2048, audioCtx.currentTime);
        piezoFilter.Q.setValueAtTime(3.0, audioCtx.currentTime);

        masterGainNode = audioCtx.createGain();
        masterGainNode.gain.setValueAtTime(currentVolume, audioCtx.currentTime);

        piezoFilter.connect(masterGainNode);
        masterGainNode.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function updateMasterVolume(val) {
      currentVolume = parseFloat(val);
      initAudio();
      if (masterGainNode) {
        masterGainNode.gain.setValueAtTime(currentVolume, audioCtx.currentTime);
      }
    }

    function updateBeepDuration(val) {
      beepDurationMultiplier = parseFloat(val);
      document.getElementById('durVal').textContent = `${beepDurationMultiplier}x`;
    }

    async function playCasioTone(bursts) {
      initAudio();
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      return new Promise((resolve) => {
        let totalDuration = 0;
        let cursorTime = audioCtx.currentTime + 0.02;

        bursts.forEach(burst => {
          for (let i = 0; i < burst.count; i++) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'square';
            osc.frequency.setValueAtTime(2048, cursorTime);

            gain.gain.setValueAtTime(0.7, cursorTime);
            gain.gain.setValueAtTime(0.7, cursorTime + burst.on - 0.002);
            gain.gain.linearRampToValueAtTime(0.001, cursorTime + burst.on);

            osc.connect(gain);
            gain.connect(piezoFilter);

            osc.start(cursorTime);
            osc.stop(cursorTime + burst.on);

            cursorTime += (burst.on + burst.off);
          }
          cursorTime += burst.gap;
        });

        totalDuration = (cursorTime - audioCtx.currentTime) * 1000;
        setTimeout(resolve, Math.max(10, totalDuration));
      });
    }

    // Scaled Remind Beep (Base 2 pulses repeated by multiplier)
    async function soundRemind() {
      const sets = Math.max(1, Math.round(beepDurationMultiplier));
      const bursts = [];
      for (let s = 0; s < sets; s++) {
        bursts.push({
          count: 2,
          on: 0.040,
          off: 0.035,
          gap: s === sets - 1 ? 0.0 : 0.100
        });
      }
      await playCasioTone(bursts);
    }

    // Scaled Alarm (Base 4 pulses x 2 sets, scaled by multiplier)
    async function soundAlarm() {
      const sets = Math.max(1, Math.round(2 * beepDurationMultiplier));
      const bursts = [];
      for (let s = 0; s < sets; s++) {
        bursts.push({
          count: 4,
          on: 0.028,
          off: 0.025,
          gap: s === sets - 1 ? 0.0 : 0.120
        });
      }
      await playCasioTone(bursts);
    }

    async function testBeepSound() {
      initAudio();
      await soundRemind();
      setTimeout(soundAlarm, 300);
    }

    // --- 2. Screen Wake Lock API ---
    let wakeLock = null;

    async function requestWakeLock() {
      if ('wakeLock' in navigator && !wakeLock) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        } catch (err) {
          console.warn('Wake Lock request failed:', err);
        }
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    // --- 3. TTS Voice & Language Engine (Sequential & Anti-Clipping) ---
    let availableVoices = [];
    let currentLang = 'en';

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('langJ').classList.toggle('active', lang === 'ja');
      document.getElementById('langE').classList.toggle('active', lang === 'en');
      autoSelectVoiceForLang(lang);
    }

    function autoSelectVoiceForLang(lang) {
      const voiceSelect = document.getElementById('voiceSelect');
      const targetPrefix = lang === 'ja' ? 'ja' : 'en';

      let foundIndex = availableVoices.findIndex(v => v.name.includes('Google') && v.lang.toLowerCase().startsWith(targetPrefix));
      if (foundIndex === -1) {
        foundIndex = availableVoices.findIndex(v => v.lang.toLowerCase().startsWith(targetPrefix));
      }

      if (foundIndex !== -1) {
        voiceSelect.value = foundIndex;
      }
    }

    function populateVoiceList() {
      if (!('speechSynthesis' in window)) return;
      availableVoices = window.speechSynthesis.getVoices();
      const voiceSelect = document.getElementById('voiceSelect');
      const currentSelected = voiceSelect.value;
      voiceSelect.innerHTML = '';

      if (availableVoices.length === 0) {
        const opt = document.createElement('option');
        opt.textContent = 'Default Browser Voice';
        voiceSelect.appendChild(opt);
        return;
      }

      availableVoices.forEach((voice, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${voice.name} (${voice.lang})`;
        voiceSelect.appendChild(option);
      });

      if (currentSelected && availableVoices[currentSelected]) {
        voiceSelect.value = currentSelected;
      } else {
        autoSelectVoiceForLang(currentLang);
      }
    }

    populateVoiceList();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = populateVoiceList;
    }

    function speakText(jaText, enText) {
      if (!document.getElementById('ttsToggle').checked) return;
      if (!('speechSynthesis' in window)) return;

      setTimeout(() => {
        window.speechSynthesis.cancel();
        const rawText = currentLang === 'ja' ? jaText : enText;
        const textToSpeak = ' ' + rawText;

        const uttr = new SpeechSynthesisUtterance(textToSpeak);
        const voiceSelect = document.getElementById('voiceSelect');
        const selectedIndex = voiceSelect.value;

        if (availableVoices[selectedIndex]) {
          uttr.voice = availableVoices[selectedIndex];
          uttr.lang = availableVoices[selectedIndex].lang;
        } else {
          uttr.lang = currentLang === 'ja' ? 'ja-JP' : 'en-US';
        }
        uttr.rate = 1.05;
        window.speechSynthesis.speak(uttr);
      }, 150);
    }

    function testVoice() {
      initAudio();
      speakText('音声通知のテストです。残り3分です。', 'Voice notification test. 3 minutes remaining.');
    }

    // --- 4. State Management ---
    let timers = [];
    let meetingLimitSec = 30 * 60;

    function updateMeetingLimit(minutes) {
      meetingLimitSec = parseInt(minutes, 10) * 60;
      document.getElementById('meetingLimitLabel').textContent = `${minutes}m`;
      updateOverallProgress();
    }

    function addTimer(name = '', minutes = 10, remind = 3) {
      const id = Date.now() + Math.random().toString(36).substr(2, 4);
      timers.push({
        id,
        name: name || `Speaker ${timers.length + 1}`,
        baseTotalSec: minutes * 60,
        totalSec: minutes * 60,
        remainSec: minutes * 60,
        remindSec: remind * 60,
        running: false,
        reminded: false,
        alarmed: false,
        completed: false,
        trimmedSec: 0,
        actualSpentSec: 0
      });
      render();
      updateOverallProgress();
      hideLogPanel();
    }

    function removeTimer(id) {
      timers = timers.filter(t => t.id !== id);
      render();
      updateOverallProgress();
    }

    function toggleTimer(id) {
      initAudio();
      const t = timers.find(item => item.id === id);
      if (!t) return;

      const willRun = !t.running;
      timers.forEach(item => item.running = false);
      t.running = willRun;

      if (willRun) {
        requestWakeLock();
        if (t.remainSec === t.totalSec) {
          speakText(`${t.name}さん、開始します`, `Starting ${t.name}`);
        }
      } else {
        checkAndReleaseWakeLock();
      }
      render();
    }

    function advanceSlot(slotIndex) {
      initAudio();
      if (slotIndex < 0 || slotIndex >= timers.length) return;
      const cur = timers[slotIndex];
      cur.running = false;
      cur.completed = true;

      const savedSec = Math.max(0, cur.remainSec);
      const lastTimer = timers[timers.length - 1];
      if (savedSec > 0 && slotIndex < timers.length - 1) {
        lastTimer.totalSec += savedSec;
        lastTimer.remainSec += savedSec;
      }

      const nextIndex = slotIndex + 1;
      if (nextIndex < timers.length) {
        timers[nextIndex].running = true;
        speakText(
          `${timers[nextIndex].name}さん、開始します`,
          `Starting ${timers[nextIndex].name}`
        );
      } else {
        checkAndReleaseWakeLock();
        speakText('すべての発表枠が終了しました', 'All sessions completed.');
        generateMeetingLog();
      }
      render();
      updateOverallProgress();
    }

    function nextTimer() {
      if (timers.length === 0) return;
      const currentIndex = timers.findIndex(t => t.running);
      if (currentIndex === -1) {
        const firstPending = timers.findIndex(t => !t.completed);
        if (firstPending !== -1) {
          toggleTimer(timers[firstPending].id);
        } else {
          toggleTimer(timers[0].id);
        }
      } else {
        advanceSlot(currentIndex);
      }
    }

    function finishMeetingManually() {
      initAudio();
      stopAll();
      generateMeetingLog();
    }

    function resetTimer(id) {
      const t = timers.find(item => item.id === id);
      if (!t) return;
      t.running = false;
      t.totalSec = t.baseTotalSec;
      t.remainSec = t.baseTotalSec;
      t.reminded = false;
      t.alarmed = false;
      t.completed = false;
      t.trimmedSec = 0;
      t.actualSpentSec = 0;
      checkAndReleaseWakeLock();
      render();
      updateOverallProgress();
      hideLogPanel();
    }

    function resetAllTimers() {
      timers.forEach(t => {
        t.running = false;
        t.totalSec = t.baseTotalSec;
        t.remainSec = t.baseTotalSec;
        t.reminded = false;
        t.alarmed = false;
        t.completed = false;
        t.trimmedSec = 0;
        t.actualSpentSec = 0;
      });
      checkAndReleaseWakeLock();
      render();
      updateOverallProgress();
      hideLogPanel();
    }

    function stopAll() {
      timers.forEach(t => t.running = false);
      checkAndReleaseWakeLock();
      render();
    }

    function checkAndReleaseWakeLock() {
      if (!timers.some(t => t.running)) {
        releaseWakeLock();
      }
    }

    function updateConfig(id, field, value) {
      const t = timers.find(item => item.id === id);
      if (!t) return;
      if (field === 'name') {
        t.name = value;
      } else if (field === 'minutes') {
        const m = Math.max(1, parseInt(value, 10) || 1);
        t.baseTotalSec = m * 60;
        t.totalSec = m * 60;
        t.trimmedSec = 0;
        if (!t.running) t.remainSec = t.totalSec;
      } else if (field === 'remind') {
        t.remindSec = (parseInt(value, 10) || 0) * 60;
      }
      render();
      updateOverallProgress();
    }

    function formatTime(sec) {
      const absSec = Math.abs(sec);
      const m = String(Math.floor(absSec / 60)).padStart(2, '0');
      const s = String(absSec % 60).padStart(2, '0');
      return (sec < 0 ? '-' : '') + `${m}:${s}`;
    }

    // --- 5. Dynamic Auto-Trim Engine ---
    function balanceOverrunAcrossRemaining() {
      let currentSpent = 0;
      let remainingBaselinePlanned = 0;
      const unstartedTimers = [];

      timers.forEach((t) => {
        if (t.completed) {
          currentSpent += (t.actualSpentSec > 0 ? t.actualSpentSec : t.totalSec);
        } else if (t.running) {
          if (t.remainSec < 0) {
            currentSpent += (t.baseTotalSec + Math.abs(t.remainSec));
          } else {
            currentSpent += (t.baseTotalSec - t.remainSec);
          }
        } else {
          unstartedTimers.push(t);
          remainingBaselinePlanned += t.baseTotalSec;
        }
      });

      const projectedTotal = currentSpent + remainingBaselinePlanned;
      const deficitSec = projectedTotal - meetingLimitSec;

      if (deficitSec > 0 && unstartedTimers.length > 0) {
        const trimPerSlot = Math.floor(deficitSec / unstartedTimers.length);
        unstartedTimers.forEach(t => {
          const maxTrimAllowed = Math.max(0, t.baseTotalSec - 60);
          const actualTrim = Math.min(trimPerSlot, maxTrimAllowed);
          t.trimmedSec = actualTrim;
          t.totalSec = t.baseTotalSec - actualTrim;
          t.remainSec = t.totalSec;
        });
      } else {
        unstartedTimers.forEach(t => {
          t.trimmedSec = 0;
          t.totalSec = t.baseTotalSec;
          t.remainSec = t.baseTotalSec;
        });
      }
    }

    // --- 6. Meeting Log Generator ---
    function generateMeetingLog() {
      const panel = document.getElementById('logPanel');
      const content = document.getElementById('logContent');

      let planTotal = 0;
      let actualTotal = 0;
      const lines = ['[Time Log] Meeting Actuals\n------------------------------'];

      timers.forEach(t => {
        const plan = t.baseTotalSec;
        const actual = t.actualSpentSec > 0 ? t.actualSpentSec : (t.totalSec - t.remainSec);
        planTotal += plan;
        actualTotal += actual;

        const diff = actual - plan;
        let diffStr = '';
        if (diff > 0) {
          diffStr = `(Over: +${formatTime(diff)})`;
        } else if (diff < 0) {
          diffStr = `(Saved: ${formatTime(Math.abs(diff))})`;
        } else {
          diffStr = `(Exact)`;
        }

        lines.push(`• ${t.name}: Plan ${formatTime(plan)} -> Actual ${formatTime(actual)} ${diffStr}`);
      });

      lines.push('------------------------------');
      const totalDiff = actualTotal - planTotal;
      let totalStatus = totalDiff > 0 ? `(Over by +${formatTime(totalDiff)})` : `(Saved ${formatTime(Math.abs(totalDiff))})`;
      lines.push(`Total: Plan ${formatTime(planTotal)} (Limit: ${formatTime(meetingLimitSec)}) -> Actual ${formatTime(actualTotal)} ${totalStatus}`);

      content.textContent = lines.join('\n');
      panel.style.display = 'flex';
    }

    function hideLogPanel() {
      document.getElementById('logPanel').style.display = 'none';
      document.getElementById('btnCopyLog').textContent = 'Copy';
    }

    function copyLog() {
      const text = document.getElementById('logContent').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('btnCopyLog');
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
      });
    }

    // --- 7. Pop-out Window Management ---
    function openMiniWindow() {
      const state = {
        timers: JSON.parse(JSON.stringify(timers)),
        lang: currentLang,
        tts: document.getElementById('ttsToggle').checked,
        voiceIndex: document.getElementById('voiceSelect').value,
        meetingLimitSec: meetingLimitSec,
        currentVolume: currentVolume,
        beepDurationMultiplier: beepDurationMultiplier
      };

      stopAll();

      const stateHash = encodeURIComponent(JSON.stringify(state));
      const url = window.location.href.split('#')[0] + '#' + stateHash;
      const w = 340;
      const h = 640;
      const left = window.screen.width - w - 20;
      const top = 50;

      window.open(
        url, 
        'AgendaMiniTimer', 
        `width=${w},height=${h},top=${top},left=${left},menubar=no,toolbar=no,location=no,status=no,resizable=yes`
      );
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

      if (e.code === 'Space') {
        e.preventDefault();
        const activeTimer = timers.find(t => t.running);
        if (activeTimer) {
          toggleTimer(activeTimer.id);
        } else if (timers.length > 0) {
          toggleTimer(timers[0].id);
        }
      } else if (e.code === 'Enter') {
        e.preventDefault();
        nextTimer();
      } else if (e.code === 'Escape') {
        e.preventDefault();
        stopAll();
      }
    });

    // --- 8. Main Tick Loop & Progress Calculation ---
    function updateOverallProgress() {
      let plannedSlotsTotal = 0;
      let totalElapsed = 0;
      let totalOverrun = 0;

      timers.forEach(t => {
        plannedSlotsTotal += t.baseTotalSec;
        const currentSpent = t.actualSpentSec > 0 ? t.actualSpentSec : (t.totalSec - t.remainSec);
        totalElapsed += currentSpent;

        if (t.remainSec < 0) {
          totalOverrun += Math.abs(t.remainSec);
        }
      });

      const estTotal = plannedSlotsTotal + totalOverrun;
      const marker = document.getElementById('plannedMarker');
      const overallBar = document.getElementById('overallBar');

      const plannedElem = document.getElementById('plannedMeetingTime');
      if (plannedSlotsTotal > meetingLimitSec) {
        const overAlloc = plannedSlotsTotal - meetingLimitSec;
        plannedElem.innerHTML = `<span class="warning-text">${formatTime(plannedSlotsTotal)} (+${formatTime(overAlloc)})</span>`;
      } else {
        plannedElem.textContent = formatTime(plannedSlotsTotal);
      }

      document.getElementById('elapsedMeetingTime').textContent = formatTime(totalElapsed);

      const estElement = document.getElementById('estMeetingTime');
      if (estTotal > meetingLimitSec) {
        const overLimit = estTotal - meetingLimitSec;
        estElement.innerHTML = `${formatTime(estTotal)} <span class="warning-text">(+${formatTime(overLimit)})</span>`;
      } else {
        estElement.textContent = formatTime(estTotal);
      }

      const maxScale = Math.max(meetingLimitSec, estTotal);
      if (maxScale > 0) {
        const limitRatio = (meetingLimitSec / maxScale) * 100;
        const currentRatio = Math.min(100, (totalElapsed / maxScale) * 100);

        if (maxScale > meetingLimitSec) {
          marker.style.display = 'block';
          marker.style.left = `${limitRatio}%`;
        } else {
          marker.style.display = 'none';
        }

        overallBar.style.width = `${currentRatio}%`;
        if (totalElapsed > meetingLimitSec) {
          overallBar.className = 'bar-fill overall-over';
        } else {
          overallBar.className = 'bar-fill overall';
        }
      }
    }

    function tick() {
      let needsRender = false;
      let hasRunningOverrun = false;

      timers.forEach(async (t) => {
        if (!t.running) return;

        t.remainSec--;
        t.actualSpentSec = (t.totalSec - t.remainSec);
        needsRender = true;

        if (t.remainSec < 0) {
          hasRunningOverrun = true;
        }

        // Sequential Reminder trigger
        if (t.remindSec > 0 && t.remainSec <= t.remindSec && !t.reminded && t.remainSec > 0) {
          t.reminded = true;
          await soundRemind();
          const leftMin = Math.round(t.remindSec / 60);
          speakText(
            `${t.name}さん、残り${leftMin}分です`,
            `${t.name}, ${leftMin} minute${leftMin > 1 ? 's' : ''} remaining`
          );
        }

        // Sequential Alarm trigger
        if (t.remainSec === 0 && !t.alarmed) {
          t.alarmed = true;
          await soundAlarm();
          speakText(
            `${t.name}さん、お時間です`,
            `${t.name}, time is up`
          );
        }
      });

      if (hasRunningOverrun) {
        balanceOverrunAcrossRemaining();
      }

      if (needsRender) {
        renderDisplayOnly();
        updateOverallProgress();
      }
    }

    setInterval(tick, 1000);

    // --- 9. DOM Renderers ---
    function renderDisplayOnly() {
      timers.forEach(t => {
        const card = document.getElementById(`card-${t.id}`);
        if (!card) return;

        const timeElem = card.querySelector('.time-display');
        const barElem = card.querySelector('.bar-fill');
        const badgeElem = card.querySelector('.trimmed-badge');

        timeElem.textContent = formatTime(t.remainSec);
        if (t.remainSec < 0) {
          timeElem.classList.add('over');
        } else {
          timeElem.classList.remove('over');
        }

        if (t.trimmedSec > 0) {
          badgeElem.style.display = 'inline-block';
          badgeElem.textContent = `-${formatTime(t.trimmedSec)} trim`;
        } else {
          badgeElem.style.display = 'none';
        }

        let ratio = Math.max(0, t.remainSec / t.totalSec);
        barElem.style.width = `${ratio * 100}%`;

        barElem.classList.remove('remind', 'over');
        if (t.remainSec <= 0) {
          barClass = 'over';
          barElem.classList.add('over');
          barElem.style.width = '100%';
        } else if (t.remindSec > 0 && t.remainSec <= t.remindSec) {
          barElem.classList.add('remind');
        }
      });
    }

    function render() {
      const container = document.getElementById('timerList');
      container.innerHTML = '';

      timers.forEach((t, index) => {
        const card = document.createElement('div');
        card.className = `timer-card ${t.running ? 'active' : ''}`;
        card.id = `card-${t.id}`;

        const isOver = t.remainSec < 0;
        let barClass = '';
        let ratio = Math.max(0, t.remainSec / t.totalSec);
        if (t.remainSec <= 0) {
          barClass = 'over';
          ratio = 1;
        } else if (t.remindSec > 0 && t.remainSec <= t.remindSec) {
          barClass = 'remind';
        }

        const durMin = Math.round(t.baseTotalSec / 60);
        const alertMin = Math.round(t.remindSec / 60);
        const isLast = (index === timers.length - 1);
        const nextBtnLabel = isLast ? 'Done ✓' : 'Next ⏭';

        card.innerHTML = `
          <div class="card-row-top">
            <div class="speaker-meta">
              <input type="text" class="speaker-name" value="${t.name}" 
                     onchange="updateConfig('${t.id}', 'name', this.value)">
              <span class="trimmed-badge" style="display:${t.trimmedSec > 0 ? 'inline-block' : 'none'};">
                -${formatTime(t.trimmedSec)} trim
              </span>
            </div>
            <button class="btn-del" onclick="removeTimer('${t.id}')">×</button>
          </div>

          <div class="sliders-panel">
            <div class="slider-item">
              <label>Dur</label>
              <input type="range" min="1" max="60" value="${durMin}" 
                     oninput="this.nextElementSibling.textContent=this.value+'m'; updateConfig('${t.id}', 'minutes', this.value)">
              <span class="val">${durMin}m</span>
            </div>
            <div class="slider-item alert-slider">
              <label>Alert</label>
              <input type="range" min="0" max="15" value="${alertMin}" 
                     oninput="this.nextElementSibling.textContent=this.value+'m'; updateConfig('${t.id}', 'remind', this.value)">
              <span class="val">${alertMin}m</span>
            </div>
          </div>

          <div class="card-row-mid">
            <div class="time-display ${isOver ? 'over' : ''}">${formatTime(t.remainSec)}</div>
            <div class="card-actions">
              <button class="${t.running ? 'danger' : 'primary'}" onclick="toggleTimer('${t.id}')">
                ${t.running ? 'Pause' : 'Start'}
              </button>
              <button class="primary" onclick="advanceSlot(${index})" title="Complete this slot and move to next">
                ${nextBtnLabel}
              </button>
              <button onclick="resetTimer('${t.id}')">Reset</button>
            </div>
          </div>
          <div class="bar-container">
            <div class="bar-fill ${barClass}" style="width: ${ratio * 100}%;"></div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // --- 10. Initialization & State Restoration ---
    function init() {
      if (window.location.hash && window.location.hash.length > 1) {
        try {
          const rawState = decodeURIComponent(window.location.hash.substring(1));
          const state = JSON.parse(rawState);

          timers = state.timers || [];
          if (state.lang) setLanguage(state.lang);
          if (state.tts !== undefined) document.getElementById('ttsToggle').checked = state.tts;
          if (state.meetingLimitSec) {
            meetingLimitSec = state.meetingLimitSec;
            document.getElementById('meetingLimitSlider').value = Math.round(meetingLimitSec / 60);
            document.getElementById('meetingLimitLabel').textContent = `${Math.round(meetingLimitSec / 60)}m`;
          }
          if (state.currentVolume !== undefined) {
            updateMasterVolume(state.currentVolume);
            document.getElementById('volSlider').value = state.currentVolume;
          }
          if (state.beepDurationMultiplier !== undefined) {
            updateBeepDuration(state.beepDurationMultiplier);
            document.getElementById('durSlider').value = state.beepDurationMultiplier;
          }

          history.replaceState(null, '', window.location.pathname);

          render();
          updateOverallProgress();

          if (timers.some(t => t.running)) {
            requestWakeLock();
            window.addEventListener('click', () => {
              initAudio();
            }, { once: true });
          }
          return;
        } catch (e) {
          console.error('Failed to restore pop-out state:', e);
        }
      }

      // Default Template
      addTimer('Speaker A', 10, 3);
      addTimer('Speaker B', 15, 5);
      addTimer('Q&A / Feedback', 5, 1);
      updateOverallProgress();
    }

    init();
  </script>
</body>
