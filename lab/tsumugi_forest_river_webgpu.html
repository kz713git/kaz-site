<script>
'use strict';
// River adaptation by Tsumugi, based on the user-supplied Open Ocean source.
// Visual river study: FFT ripples + prescribed advection, NOT a shallow-water solver.
// FFT (Tessendorf) waves in 4 cascades, single-scattering sky, procedural clouds,
// LEAN-style roughness, buoyant floating camera solved on the GPU, bloom + ACES.

const Q = new URLSearchParams(location.search);
const qn = (k, d) => (Q.has(k) ? parseFloat(Q.get(k)) : d);

const N = 256, NN = N * N;
const CASCADE_L = [521, 103, 21.7, 4.4];    // patch sizes (m), deliberately incommensurate
const NUM_C = 4;
const G = 9.81;
const LOOP_T = 600;                          // spectrum repeats every LOOP_T seconds (keeps phase precise)

const canvas = document.getElementById('c');
const fail = (msg) => { const e = document.getElementById('err'); e.style.display = 'grid'; e.textContent = msg; console.error(msg); };

// ---------------------------------------------------------------- WGSL
const WGSL_COMMON = /* wgsl */`
const PI = 3.141592653589793;
const TAU = 6.283185307179586;

fn hashU(x: u32) -> u32 {
  var h = x; h ^= h >> 16u; h *= 0x7feb352du; h ^= h >> 15u; h *= 0x846ca68bu; h ^= h >> 16u; return h;
}
fn hash2(p: vec2f) -> f32 {
  let q = bitcast<vec2u>(vec2i(p));
  return f32(hashU(q.x ^ hashU(q.y + 0x9e3779b9u))) * (1.0 / 4294967296.0);
}
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = p - i;
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let a = hash2(i); let b = hash2(i + vec2f(1, 0));
  let c = hash2(i + vec2f(0, 1)); let d = hash2(i + vec2f(1, 1));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
fn fbm(p: vec2f, oct: i32) -> f32 {
  var s = 0.0; var a = 0.5; var q = p; var n = 0.0;
  let m = mat2x2f(1.62, 1.17, -1.17, 1.62);
  for (var i = 0; i < oct; i++) { s += a * vnoise(q); n += a; q = m * q + vec2f(17.3, 9.1); a *= 0.5; }
  return s / n;
}

// River corridor shared by terrain and water shading.
fn riverCenter(z: f32) -> f32 { return 2.0*sin(z*0.042)+0.65*sin(z*0.112); }
fn riverWidth(z: f32) -> f32 { return 3.8+0.55*sin(z*0.07+0.5); }
fn riverBed(p: vec2f) -> f32 {
 let d=abs(p.x-riverCenter(p.y)); let w=riverWidth(p.y);
 return -1.05 + 1.85*smoothstep(w-1.25,w+1.3,d) + 0.016*max(d-w-3.0,0.0)
       + 0.07*sin(p.y*0.33)*smoothstep(w-0.5,w+2.0,d);
}
fn forestReflection(origin: vec3f, ray: vec3f, sky: vec3f) -> vec3f {
 let t=clamp((8.5-origin.y)/max(ray.y,0.025),0.0,180.0);
 let p=origin.xz+ray.xz*t;
 let d=abs(p.x-riverCenter(p.y));
 let tree=smoothstep(4.3,8.0,d)*(1.0-smoothstep(80.0,150.0,t));
 let gaps=smoothstep(0.28,0.65,fbm(p*.13,3));
 let green=vec3f(.016,.049,.022)*(0.7+gaps*1.3);
 return mix(sky,green*2.0,tree*(.65+.33*gaps));
}

// Lat-long sky mapping, upper hemisphere only, sqrt-warped so the horizon gets most texels.
fn skyUV(d: vec3f) -> vec2f {
  let az = atan2(d.x, -d.z);
  let el = asin(clamp(d.y / max(length(d), 1e-6), 0.0, 1.0));
  return vec2f(az / TAU + 0.5, sqrt(el / (PI * 0.5)));
}
fn skyDir(uv: vec2f) -> vec3f {
  let az = (uv.x - 0.5) * TAU; let el = uv.y * uv.y * PI * 0.5;
  return vec3f(cos(el) * sin(az), sin(el), -cos(el) * cos(az));
}
fn hg(c: f32, g: f32) -> f32 { let g2 = g * g; return (1.0 - g2) / (4.0 * PI * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5)); }

// Two procedural cloud layers (fair-weather cumulus + high cirrus) on spherical shells.
fn shellT(d: vec3f, h: f32) -> f32 {
  let R = 6360e3; let o = vec3f(0.0, R + 2.0, 0.0);
  let b = dot(o, d); let c = dot(o, o) - (R + h) * (R + h);
  return -b + sqrt(max(b * b - c, 0.0));
}
fn clouds(d: vec3f, sun: vec3f, sunE: vec3f, amb: vec3f, skyCol: vec3f, cover: f32) -> vec4f {
  if (d.y <= 0.0) { return vec4f(0.0); }
  let cosT = dot(d, sun);
  let phase = (mix(hg(cosT, 0.65), hg(cosT, -0.15), 0.35)) * 4.0 * PI;
  let sunH = normalize(sun.xz + vec2f(1e-4, 0.0));
  var col = vec3f(0.0); var alpha = 0.0;

  // cirrus (behind cumulus)
  {
    let t = shellT(d, 8500.0);
    let p = (d * t).xz;
    let r = mat2x2f(0.8, 0.6, -0.6, 0.8) * p;
    let uv = vec2f(r.x * 0.00004, r.y * 0.00018) + vec2f(11.0, 3.0);
    var c = fbm(uv + vec2f(fbm(uv * 2.0, 3) * 1.5, 0.0), 5);
    c = smoothstep(0.55, 0.88, c) * 0.35;
    let fogT = 1.0 - exp(-t / 60000.0);
    var cc = (sunE * (0.10 + 0.9 * phase * 0.12) + amb * 0.9) * 0.9;
    cc = mix(cc, skyCol, fogT);
    let a = c * (1.0 - fogT * fogT);
    col = cc * a; alpha = a;
  }
  // cumulus
  {
    let t = shellT(d, 1500.0);
    let p = (d * t).xz;
    let uv = p * 0.00032 + vec2f(3.1, 7.7);
    let warp = vec2f(fbm(uv * 0.5 + 5.2, 3), fbm(uv * 0.5 + 1.3, 3)) - 0.5;
    let q = uv + warp * 0.35;
    let base = fbm(q, 6);
    let cov = cover;
    let dens = clamp((base - cov) * 3.0, 0.0, 1.0);
    if (dens > 0.0) {
      let ds = clamp((fbm(q + sunH * 0.09, 5) - cov) * 3.0, 0.0, 1.0);
      let light = exp(-ds * 3.2);
      let powder = 1.0 - exp(-dens * 6.0);
      var cc = sunE * (light * (0.55 + 0.45 * powder) * phase * 0.16 + 0.015)
             + amb * mix(1.05, 0.55, dens);
      let fogT = 1.0 - exp(-t / 26000.0);
      cc = mix(cc, skyCol, fogT);
      let a = smoothstep(0.0, 0.35, dens) * (1.0 - fogT * fogT * fogT);
      col = mix(col, cc, a); alpha = alpha + a * (1.0 - alpha);
    }
  }
  return vec4f(col, alpha);
}
`;

// Shared render bindings
const WGSL_RENDER_DECL = /* wgsl */`
struct Frame {
  sunDir: vec4f,   // xyz, w = time
  sunE: vec4f,     // sun illuminance at sea level, w = exposure
  ambient: vec4f,  // sky irradiance (rgb), w = cloud cover
  grid: vec4f,     // snapped grid center xz, w = chop
  L: vec4f,        // cascade sizes
  res: vec4f,      // w, h, 1/w, 1/h
  zenith: vec4f,   // zenith sky radiance
  misc: vec4f,     // x foam strength
}
struct Cam {
  viewProj: mat4x4f,
  eye: vec4f, right: vec4f, up: vec4f, fwd: vec4f, state: vec4f, tilt: vec4f,
}
@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(1) var<storage, read> C: Cam;
@group(0) @binding(2) var sAniso: sampler;
@group(0) @binding(3) var sLin: sampler;
@group(0) @binding(4) var tDisp: texture_2d_array<f32>;
@group(0) @binding(5) var tDeriv: texture_2d_array<f32>;
@group(0) @binding(6) var tVar: texture_2d_array<f32>;
@group(0) @binding(7) var tSky: texture_2d<f32>;
@group(0) @binding(8) var tEnv: texture_2d_array<f32>;

fn skyRadiance(d: vec3f) -> vec3f {
  return textureSampleLevel(tSky, sLin, skyUV(vec3f(d.x, max(d.y, 0.0), d.z)), 0.0).rgb;
}
fn envRadiance(d: vec3f, lod: f32) -> vec3f {
  return textureSampleLevel(tEnv, sLin, skyUV(vec3f(d.x, max(d.y, 0.0), d.z)), 0, lod).rgb;
}
`;

// ---- spectrum evolution: h0 -> packed complex fields for 8 real outputs
const WGSL_SPECTRUM = /* wgsl */`
struct P { time: f32, w0: f32, _a: f32, _b: f32, L: vec4f }
@group(0) @binding(0) var<uniform> U: P;
@group(0) @binding(1) var<storage, read> h0: array<vec4f>;
@group(0) @binding(2) var<storage, read_write> outBuf: array<vec4f>;
const N = ${N}u;
fn cmul(a: vec2f, b: vec2f) -> vec2f { return vec2f(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
fn pack(a: vec2f, b: vec2f) -> vec2f { return vec2f(a.x - b.y, a.y + b.x); } // a + i*b
@compute @workgroup_size(16, 16, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  let x = id.x; let y = id.y; let c = id.z;
  let mx = select(f32(x), f32(x) - f32(N), x >= N / 2u);
  let my = select(f32(y), f32(y) - f32(N), y >= N / 2u);
  let k = vec2f(mx, my) * 6.283185307 / U.L[c];
  let kl = max(length(k), 1e-6);
  let w = floor(sqrt(9.81 * kl) / U.w0) * U.w0;
  let ph = w * U.time;
  let e = vec2f(cos(ph), sin(ph));
  let H = h0[c * N * N + y * N + x];
  let h = cmul(H.xy, e) + cmul(H.zw, vec2f(e.x, -e.y));
  let ih = vec2f(-h.y, h.x);
  let dx = ih * (k.x / kl);
  let dz = ih * (k.y / kl);
  let sx = ih * k.x;
  let sz = ih * k.y;
  let dxx = -h * (k.x * k.x / kl);
  let dzz = -h * (k.y * k.y / kl);
  let dxz = -h * (k.x * k.y / kl);
  let o = (c * 2u) * N * N + y * N + x;
  outBuf[o] = vec4f(pack(dx, h), pack(dz, sx));
  outBuf[o + N * N] = vec4f(pack(sz, dxx), pack(dzz, dxz));
}
`;

// ---- one 256-point inverse FFT per workgroup (rows or columns), two complex numbers per vec4
const WGSL_FFT = /* wgsl */`
override HORIZONTAL: bool = true;
const N = ${N}u;
const LOG_N = 8u;
@group(0) @binding(0) var<storage, read> src: array<vec4f>;
@group(0) @binding(1) var<storage, read_write> dst: array<vec4f>;
var<workgroup> sh: array<vec4f, ${2 * N}>;
fn cmul(a: vec2f, b: vec2f) -> vec2f { return vec2f(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
@compute @workgroup_size(${N})
fn main(@builtin(local_invocation_id) lid: vec3u, @builtin(workgroup_id) wid: vec3u) {
  let i = lid.x;
  let base = wid.z * N * N;
  var start: u32; var stride: u32;
  if (HORIZONTAL) { start = base + wid.x * N; stride = 1u; } else { start = base + wid.x; stride = N; }
  let r = reverseBits(i) >> (32u - LOG_N);
  sh[i] = src[start + r * stride];
  workgroupBarrier();
  var ping = 0u;
  for (var s = 0u; s < LOG_N; s++) {
    let hlf = 1u << s;
    let size = hlf << 1u;
    let k = i & (size - 1u);
    let j = i - k;
    let kk = k & (hlf - 1u);
    let ang = 6.283185307179586 * f32(kk) / f32(size);
    let w = vec2f(cos(ang), sin(ang));
    let a = sh[ping * N + j + kk];
    let b = sh[ping * N + j + kk + hlf];
    let wb = vec4f(cmul(w, b.xy), cmul(w, b.zw));
    sh[(1u - ping) * N + i] = select(a - wb, a + wb, k < hlf);
    workgroupBarrier();
    ping = 1u - ping;
  }
  dst[start + i * stride] = sh[ping * N + i];
}
`;

// ---- unpack FFT results into filterable textures, accumulate persistent foam
const WGSL_ASSEMBLE = /* wgsl */`
struct P { dt: f32, chop: f32, _a: f32, _b: f32 }
@group(0) @binding(0) var<uniform> U: P;
@group(0) @binding(1) var<storage, read> fft: array<vec4f>;
@group(0) @binding(2) var<storage, read_write> foam: array<f32>;
@group(0) @binding(3) var oDisp: texture_storage_2d_array<rgba16float, write>;
@group(0) @binding(4) var oDeriv: texture_storage_2d_array<rgba16float, write>;
@group(0) @binding(5) var oVar: texture_storage_2d_array<rgba16float, write>;
const N = ${N}u;
@compute @workgroup_size(16, 16, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  let c = id.z;
  let o = (c * 2u) * N * N + id.y * N + id.x;
  let a = fft[o];
  let b = fft[o + N * N];
  let lam = U.chop * array<f32, 4>(1.0, 1.0, 0.8, 0.55)[c];
  let D = vec3f(a.x * lam, a.y, a.z * lam);
  let s = vec2f(a.w, b.x);
  let jxx = b.y * lam; let jzz = b.z * lam; let jxz = b.w * lam;
  let J = (1.0 + jxx) * (1.0 + jzz) - jxz * jxz;
  let fi = c * N * N + id.y * N + id.x;
  // foam: inject where the surface folds / compresses, decay over a few seconds
  let thr = array<f32, 4>(U._a, U._a - 0.05, U._a - 0.06, -1.0)[c];
  let inject = clamp((thr - J) * 4.0, 0.0, 1.0);
  let decay = array<f32, 4>(0.22, 0.30, 0.6, 1.0)[c];
  var f = foam[fi] * exp(-U.dt * decay) + inject * U.dt * 2.5;
  f = min(f, 1.0);
  foam[fi] = f;
  let p = vec2i(id.xy);
  textureStore(oDisp, p, c, vec4f(D, f));
  textureStore(oDeriv, p, c, vec4f(s, jxx, jzz));
  textureStore(oVar, p, c, vec4f(s * s, jxz, J));
}
`;

// ---- 2x2 box downsample for mip chains of 2d-array textures
const WGSL_MIP = /* wgsl */`
@group(0) @binding(0) var src: texture_2d_array<f32>;
@group(0) @binding(1) var dst: texture_storage_2d_array<rgba16float, write>;
@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  let dd = textureDimensions(dst);
  if (id.x >= dd.x || id.y >= dd.y) { return; }
  let sd = vec2i(textureDimensions(src)) - 1;
  let p = vec2i(id.xy) * 2;
  let l = i32(id.z);
  let v = textureLoad(src, min(p, sd), l, 0) + textureLoad(src, min(p + vec2i(1, 0), sd), l, 0)
        + textureLoad(src, min(p + vec2i(0, 1), sd), l, 0) + textureLoad(src, min(p + vec2i(1, 1), sd), l, 0);
  textureStore(dst, vec2i(id.xy), l, v * 0.25);
}
`;

// ---- single-scattering atmosphere (Rayleigh + Mie + ozone) into a lat-long LUT
const WGSL_ATMOS = /* wgsl */`
${WGSL_COMMON}
struct P { sun: vec4f }
@group(0) @binding(0) var<uniform> U: P;
@group(0) @binding(1) var outTex: texture_storage_2d<rgba16float, write>;
const RE = 6360e3; const RA = 6460e3;
const BR = vec3f(5.802e-6, 13.558e-6, 33.1e-6);
const BMs = 5.0e-6; const BMe = 5.5e-6;
const BO = vec3f(0.650e-6, 1.881e-6, 0.085e-6);
fn dens(h: f32) -> vec3f { return vec3f(exp(-h / 8000.0), exp(-h / 1200.0), max(0.0, 1.0 - abs(h - 25000.0) / 15000.0)); }
fn ext(d: vec3f) -> vec3f { return BR * d.x + BMe * d.y + BO * d.z; }
fn farT(o: vec3f, d: vec3f, r: f32) -> f32 { let b = dot(o, d); let c = dot(o, o) - r * r; return -b + sqrt(max(b * b - c, 0.0)); }
fn hitsGround(o: vec3f, d: vec3f) -> bool { let b = dot(o, d); let c = dot(o, o) - RE * RE; return b < 0.0 && b * b - c > 0.0; }
@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  let dim = textureDimensions(outTex);
  if (id.x >= dim.x || id.y >= dim.y) { return; }
  let uv = (vec2f(id.xy) + 0.5) / vec2f(dim);
  var d = skyDir(uv);
  d = normalize(vec3f(d.x, max(d.y, 0.0015), d.z));
  let sun = U.sun.xyz;
  let o = vec3f(0.0, RE + 2.0, 0.0);
  let tMax = farT(o, d, RA);
  let STEPS = 40;
  var odv = vec3f(0.0);
  var sumR = vec3f(0.0); var sumM = vec3f(0.0);
  var tPrev = 0.0;
  for (var i = 0; i < STEPS; i++) {
    // quadratic distribution of samples (dense near the viewer)
    let f1 = (f32(i) + 1.0) / f32(STEPS);
    let t = tMax * f1 * f1;
    let dt = t - tPrev;
    let tm = (t + tPrev) * 0.5;
    tPrev = t;
    let p = o + d * tm;
    let h = length(p) - RE;
    let dn = dens(h);
    odv += ext(dn) * dt;
    if (hitsGround(p, sun)) { continue; }
    let tl = farT(p, sun, RA);
    var odl = vec3f(0.0);
    let LS = 8;
    for (var j = 0; j < LS; j++) {
      let pl = p + sun * tl * (f32(j) + 0.5) / f32(LS);
      odl += ext(dens(length(pl) - RE)) * (tl / f32(LS));
    }
    let T = exp(-(odv + odl));
    sumR += T * dn.x * dt;
    sumM += T * dn.y * dt;
  }
  let mu = dot(d, sun);
  let pR = 3.0 / (16.0 * PI) * (1.0 + mu * mu);
  let g = 0.80;
  let pM = 3.0 / (8.0 * PI) * ((1.0 - g * g) * (1.0 + mu * mu)) / ((2.0 + g * g) * pow(1.0 + g * g - 2.0 * g * mu, 1.5));
  var L = sumR * BR * pR + sumM * BMs * pM;
  // cheap multiple-scattering lift: an isotropic fraction of single scattering
  L += sumR * BR * 0.06 * max(sun.y + 0.1, 0.0);
  textureStore(outTex, vec2i(id.xy), vec4f(L * U.sun.w, 1.0));
}
`;

// ---- reflection environment = sky LUT + clouds (no sun disk; sun handled analytically)
const WGSL_ENV = /* wgsl */`
${WGSL_COMMON}
struct P { sun: vec4f, sunE: vec4f, amb: vec4f }
@group(0) @binding(0) var<uniform> U: P;
@group(0) @binding(1) var sky: texture_2d<f32>;
@group(0) @binding(2) var samp: sampler;
@group(0) @binding(3) var outTex: texture_storage_2d_array<rgba16float, write>;
@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  let dim = textureDimensions(outTex);
  if (id.x >= dim.x || id.y >= dim.y) { return; }
  let uv = (vec2f(id.xy) + 0.5) / vec2f(dim);
  let d = skyDir(uv);
  let s = textureSampleLevel(sky, samp, uv, 0.0).rgb;
  let cl = clouds(d, U.sun.xyz, U.sunE.rgb, U.amb.rgb, s, U.amb.w);
  textureStore(outTex, vec2i(id.xy), 0, vec4f(s * (1.0 - cl.a) + cl.rgb, 1.0));

`;

// ---- buoyant camera, solved on the GPU against the live displacement field
const WGSL_CAMERA = /* wgsl */`
struct In { a: vec4f, b: vec4f, c: vec4f, L: vec4f }
struct Cam { viewProj: mat4x4f, eye: vec4f, right: vec4f, up: vec4f, fwd: vec4f, state: vec4f, tilt: vec4f }
@group(0) @binding(0) var<uniform> I: In;
@group(0) @binding(1) var<storage, read_write> C: Cam;
@group(0) @binding(2) var tDisp: texture_2d_array<f32>;
@group(0) @binding(3) var tDeriv: texture_2d_array<f32>;
@group(0) @binding(4) var samp: sampler;
fn dispAt(p: vec2f) -> vec3f {
  return textureSampleLevel(tDisp, samp, p / I.L.x, 0, 1.0).xyz
       + textureSampleLevel(tDisp, samp, p / I.L.y, 1, 2.5).xyz
       + textureSampleLevel(tDisp, samp, p / I.L.z, 2, 5.0).xyz
       + textureSampleLevel(tDisp, samp, p / I.L.w, 3, 8.0).xyz;
}
fn slopeAt(p: vec2f) -> vec2f {
  return textureSampleLevel(tDeriv, samp, p / I.L.x, 0, 1.5).xy
       + textureSampleLevel(tDeriv, samp, p / I.L.y, 1, 4.0).xy;
}
fn rot(v: vec3f, k: vec3f, c: f32, s: f32) -> vec3f { return v * c + cross(k, v) * s + k * dot(k, v) * (1.0 - c); }
@compute @workgroup_size(1)
fn main() {
  let tgt = I.a.xy;
  var q = tgt;
  for (var i = 0; i < 5; i++) { q = tgt - dispAt(q).xz; }
  let waterY = dispAt(q).y;
  let s = slopeAt(q);
  let wn = normalize(vec3f(-s.x, 1.0, -s.y));
  let dt = clamp(I.b.w, 0.0, 0.1);
  var y = C.state.x; var vy = C.state.y; var tilt = C.tilt.xyz;
  if (I.c.w > 0.5 || length(tilt) < 0.5) { y = select(I.b.z, waterY + I.b.x, I.b.y > 0.5); vy = 0.0; tilt = wn; }
  if (I.b.y > 0.5) {
    let h = dt / 8.0;
    for (var i = 0; i < 8; i++) {
      let acc = 5.0 * (waterY + I.b.x - y) - 2.6 * vy;
      vy += acc * h; y += vy * h;
    }
    y = max(y, waterY + 0.45);
    tilt = normalize(mix(tilt, wn, 1.0 - exp(-dt * 1.6)));
  } else {
    y = max(I.b.z, waterY + 0.5); vy = 0.0;
    tilt = normalize(mix(tilt, vec3f(0.0, 1.0, 0.0), 1.0 - exp(-dt * 2.0)));
  }
  C.state = vec4f(y, vy, waterY, 0.0);
  C.tilt = vec4f(tilt, 0.0);
  let yaw = I.a.z; let pitch = I.a.w;
  var f = vec3f(cos(pitch) * sin(yaw), sin(pitch), -cos(pitch) * cos(yaw));
  var u = vec3f(-sin(pitch) * sin(yaw), cos(pitch), sin(pitch) * cos(yaw));
  let up0 = vec3f(0.0, 1.0, 0.0);
  let tl = normalize(mix(up0, tilt, 0.55));
  let ax = cross(up0, tl); let sa = length(ax);
  if (sa > 1e-6) { let k = ax / sa; let ca = dot(up0, tl); f = rot(f, k, ca, sa); u = rot(u, k, ca, sa); }
  let r = normalize(cross(f, u)); u = cross(r, f);
  let ty = I.c.x; let tx = ty * I.c.y;
  let view = mat4x4f(vec4f(r.x, u.x, -f.x, 0.0), vec4f(r.y, u.y, -f.y, 0.0), vec4f(r.z, u.z, -f.z, 0.0), vec4f(0.0, 0.0, 0.0, 1.0));
  let proj = mat4x4f(vec4f(1.0 / tx, 0.0, 0.0, 0.0), vec4f(0.0, 1.0 / ty, 0.0, 0.0), vec4f(0.0, 0.0, 0.0, -1.0), vec4f(0.0, 0.0, I.c.z, 0.0));

  C.eye = vec4f(tgt.x, y, tgt.y, 1.0);
  C.right = vec4f(r, tx); C.up = vec4f(u, ty); C.fwd = vec4f(f, 0.0);
}
`;

const WGSL_SKY = /* wgsl */`

// ---- ocean surface
const WGSL_WATER = /* wgsl */`
${WGSL_COMMON}
${WGSL_RENDER_DECL}
struct VOut {
  @builtin(position) pos: vec4f,
  @location(0) wpos: vec3f,
  @location(1) xz: vec2f,
  @location(2) h: f32,
}
@vertex fn vs(@location(0) g: vec3f) -> VOut {
  let z=g.y;
  let xz=vec2f(g.x+riverCenter(z),z);
  let adv=xz+vec2f(0.0,-F.sunDir.w*.65);
  var d = vec3f(0.0);
  for (var c = 0; c < 4; c++) {
    let texel = F.L[c] / 256.0;
    let lod = max(log2(g.z / texel) + 0.5, 0.0);
    d += textureSampleLevel(tDisp, sAniso, adv / F.L[c], c, lod).xyz;
  }
  var p = vec3f(xz.x + d.x, d.y, xz.y + d.z);
  let rel = p - C.eye.xyz;
  p.y -= dot(rel.xz, rel.xz) / (2.0 * 6360e3);   // earth curvature
  var o: VOut;
  o.pos = C.viewProj * vec4f(p - C.eye.xyz, 1.0);
  o.wpos = p; o.xz = xz; o.h = d.y;
  return o;
}

fn fresnelRough(ndv: f32, a: f32) -> f32 {
  let F0 = 0.02;
  return F0 + (1.0 - F0) * pow(1.0 - ndv, 5.0) / (1.0 + 2.5 * a * a);
}

@fragment fn fs(i: VOut) -> @location(0) vec4f {
  let bankY=riverBed(i.wpos.xz);
  if(bankY>i.wpos.y){discard;}
  let depth=max(i.wpos.y-bankY,0.0);
  var s = vec2f(0.0); var jx = 0.0; var jz = 0.0; var jxz = 0.0; var vr = 0.0; var foamP = 0.0;
  for (var c = 0; c < 4; c++) {
    let uv = (i.xz+vec2f(0.0,-F.sunDir.w*.65)) / F.L[c];
    let dv = textureSample(tDeriv, sAniso, uv, c);
    let vv = textureSample(tVar, sAniso, uv, c);
    let dd = textureSample(tDisp, sAniso, uv, c);
    // texels per pixel along the long axis of the footprint; detail that can't be
    // resolved is moved from the normal into the roughness (stops far-field speckle)
    let fp = max(length(dpdx(uv)), length(dpdy(uv))) * 256.0;
    let keep = 1.0 - smoothstep(3.0, 14.0, fp);
    s += dv.xy * keep; jx += dv.z * keep; jz += dv.w * keep; jxz += vv.z * keep;
    vr += max(vv.x - dv.x * dv.x, 0.0) + max(vv.y - dv.y * dv.y, 0.0) + (1.0 - keep) * dot(dv.xy, dv.xy);
    foamP += dd.w * select(1.0, 0.0, c == 3);
  }
  let toEye = C.eye.xyz - i.wpos;
  let dist = length(toEye);
  let V = toEye / dist;
  let L = F.sunDir.xyz;
  var n = normalize(vec3f(-s.x / max(1.0 + jx, 0.5), 1.0, -s.y / max(1.0 + jz, 0.5)));
  // keep shading normals visible from the eye (avoids black rims at grazing angles)
  let nv0 = dot(n, V);
  if (nv0 < 0.02) { n = normalize(n + V * (0.02 - nv0)); }

  let a2 = clamp(0.0042 + vr + dist * 0.000015, 0.0, 0.6);
  // far away, facet slopes average out: the sea trends toward a rough mirror of the horizon sky
  let farMix = smoothstep(60.0, 2500.0, dist) * 0.7;
  let nF = normalize(mix(n, vec3f(0.0, 1.0, 0.0), farMix));
  let a = sqrt(a2);
  let ndv = clamp(dot(n, V), 1e-3, 1.0);
  let ndl = max(dot(n, L), 0.0);
  let fr = fresnelRough(clamp(dot(nF, V), 1e-3, 1.0), a);

  // sky/cloud reflection
  var R = reflect(-V, nF);
  R.y = abs(R.y);
  let lod = clamp(log2(a / 0.0061), 0.0, 9.0);
  let refl = forestReflection(i.wpos,R,envRadiance(R, lod));

  // sun glitter: GGX with roughness widened by unresolved slope variance
  let H = normalize(L + V);
  let ndh = max(dot(n, H), 0.0);
  let dd = ndh * ndh * (a2 - 1.0) + 1.0;
  let D = a2 / (PI * dd * dd);
  let vis = 0.5 / (ndl * sqrt(ndv * ndv * (1.0 - a2) + a2) + ndv * sqrt(ndl * ndl * (1.0 - a2) + a2) + 1e-5);
  let fsch = 0.02 + 0.98 * pow(1.0 - max(dot(V, H), 0.0), 5.0);
  let spec = min(D * vis * fsch * ndl, 900.0) * F.sunE.rgb * smoothstep(-0.02, 0.05, L.y);

  // light from inside the water
  let Ed = F.sunE.rgb * max(L.y, 0.0) + F.ambient.rgb;
  let gravel=fbm(i.xz*13.0+vec2f(s.x,s.y)*.6,3);
  let pebbles=pow(vnoise(i.xz*30.0),3.0);
  let bedCol=mix(vec3f(.16,.125,.065),vec3f(.34,.31,.21),gravel)+pebbles*.045;
  let trans=exp(-vec3f(.95,.39,.24)*depth/max(ndv,.25));
  let leafShade=.5+.5*smoothstep(.25,.7,fbm(i.xz*.32+vec2f(2.,0.),3));
  let caust=.018*pow(.5+.5*sin(i.xz.x*15.+sin(i.xz.y*12.-F.sunDir.w*2.)),5.0);
  let body=(Ed*.1+F.ambient.rgb*.3)*bedCol*trans*leafShade+Ed*vec3f(.007,.025,.018)*(1.0-trans)+caust*trans;
  let hh = clamp(i.h * 0.6 + 0.25, 0.0, 2.0);
  let k1 = hh * pow(max(dot(L, -V), 0.0), 4.0) * pow(0.5 - 0.5 * dot(L, n), 3.0);
  let k2 = pow(ndv, 2.0);
  let sss = F.sunE.rgb * vec3f(0.02, 0.17, 0.16) * (k1 * smoothstep(0.3, 1.6, hh) * 1.6 + k2 * 0.01) * 0.06;
  var col = (1.0 - fr) * (body + sss) + fr * refl + spec;

  // foam: persistent (advected-by-wave) foam + instantaneous whitecaps on folding crests
  let J = (1.0 + jx) * (1.0 + jz) - jxz * jxz;
  let cap = smoothstep(0.0, 0.35, F.misc.y - J) * (1.0 - smoothstep(150.0, 900.0, dist) * 0.6);
  var wake=0.0;
  let rocks=array<vec3f,6>(vec3f(-1.65,-8.,.8),vec3f(1.7,-18.,.65),vec3f(-.5,-33.,.7),vec3f(2.2,8.,.85),vec3f(-2.2,23.,.6),vec3f(.3,-55.,.55));
  for(var j=0;j<6;j++){let rk=rocks[j];let q=i.xz-vec2f(riverCenter(rk.y)+rk.x,rk.y);let downstream=smoothstep(-.2,.2,q.y)*(1.0-smoothstep(.5,5.,q.y));wake+=downstream*exp(-q.x*q.x/(rk.z*rk.z+q.y*.13));}
  let streak=fbm(vec2f(i.xz.x*3.5,(i.xz.y-F.sunDir.w*.9)*2.),3);
  let cover=clamp(foamP*F.misc.x+cap+sin(streak*8.)*sin(streak*8.)*wake*.6,0.0,1.0);
  let wr = mat2x2f(0.8776, -0.4794, 0.4794, 0.8776) * i.xz;   // wind-aligned frame
  let nz = fbm(vec2f(wr.x * 0.35, wr.y * 1.1), 5);
  let nz2 = fbm(i.xz * 3.5, 3);
  // lacy, wind-streaked foam: dense where fresh, thinning into a net of holes as it ages
  let lace = 1.0 - abs(fbm(i.xz * 7.0 + vec2f(3.7, 1.9), 3) * 2.0 - 1.0);
  let nearF = 1.0 - smoothstep(40.0, 400.0, dist);
  let n0 = nz * 0.55 + nz2 * 0.25 + lace * 0.2;
  let cv = cover * 0.82;
  let pattern = smoothstep(1.0 - cv, 1.0 - cv + 0.4, n0) * mix(0.55, 1.0, smoothstep(0.35, 0.8, cover + lace * 0.3));
  let foam = mix(cover * 0.45, pattern, nearF) * smoothstep(0.03, 0.25, cover) * 0.92;
  let foamCol = 0.85 * (F.sunE.rgb * (0.25 + 0.75 * max(dot(n, L), 0.0) + 0.35 * max(L.y, 0.0)) + F.ambient.rgb * 0.8) / PI;
  col = mix(col, foamCol, foam);

  // aerial perspective toward the horizon haze
  let fogF = 1.0 - exp(-dist * 0.00026);
  let hz = normalize(vec3f(-V.x, 0.0, -V.z));
  col = mix(col, skyRadiance(hz)*.55, fogF);
  return vec4f(col, 1.0);
}
`;

// ---- post: bloom chain + tonemap
const WGSL_POST = /* wgsl */`
@group(0) @binding(0) var src: texture_2d<f32>;
@group(0) @binding(1) var samp: sampler;
@group(0) @binding(2) var<uniform> U: vec4f;   // texel size xy, mode z, strength/exposure w
struct O { @builtin(position) pos: vec4f, @location(0) uv: vec2f }
@vertex fn vs(@builtin(vertex_index) vi: u32) -> O {
  let p = vec2f(f32((vi << 1u) & 2u), f32(vi & 2u));
  var o: O; o.pos = vec4f(p * 2.0 - 1.0, 0.0, 1.0); o.uv = vec2f(p.x, 1.0 - p.y); return o;
}
fn S(uv: vec2f) -> vec3f { return textureSampleLevel(src, samp, uv, 0.0).rgb; }
fn karis(c: vec3f) -> f32 { return 1.0 / (1.0 + dot(c, vec3f(0.2126, 0.7152, 0.0722))); }
@fragment fn down(i: O) -> @location(0) vec4f {
  let t = U.xy; let uv = i.uv;
  let a = S(uv + t * vec2f(-2, -2)); let b = S(uv + t * vec2f(0, -2)); let c = S(uv + t * vec2f(2, -2));
  let d = S(uv + t * vec2f(-2, 0)); let e = S(uv); let f = S(uv + t * vec2f(2, 0));
  let g = S(uv + t * vec2f(-2, 2)); let h = S(uv + t * vec2f(0, 2)); let k = S(uv + t * vec2f(2, 2));
  let l = S(uv + t * vec2f(-1, -1)); let m = S(uv + t * vec2f(1, -1));
  let n = S(uv + t * vec2f(-1, 1)); let o = S(uv + t * vec2f(1, 1));
  if (U.z > 0.5) {
    // first level: Karis-weighted groups suppress sparkle fireflies
    let g0 = (l + m + n + o) * 0.25; let g1 = (a + b + d + e) * 0.25; let g2 = (b + c + e + f) * 0.25;
    let g3 = (d + e + g + h) * 0.25; let g4 = (e + f + h + k) * 0.25;
    let w0 = karis(g0) * 0.5; let w1 = karis(g1) * 0.125; let w2 = karis(g2) * 0.125; let w3 = karis(g3) * 0.125; let w4 = karis(g4) * 0.125;
    return vec4f((g0 * w0 + g1 * w1 + g2 * w2 + g3 * w3 + g4 * w4) / (w0 + w1 + w2 + w3 + w4), 1.0);
  }
  var r = e * 0.125 + (a + c + g + k) * 0.03125 + (b + d + f + h) * 0.0625 + (l + m + n + o) * 0.125;
  return vec4f(r, 1.0);
}
@fragment fn up(i: O) -> @location(0) vec4f {
  let t = U.xy; let uv = i.uv;
  var r = S(uv) * 4.0;
  r += (S(uv + t * vec2f(-1, 0)) + S(uv + t * vec2f(1, 0)) + S(uv + t * vec2f(0, -1)) + S(uv + t * vec2f(0, 1))) * 2.0;
  r += S(uv + t * vec2f(-1, -1)) + S(uv + t * vec2f(1, -1)) + S(uv + t * vec2f(-1, 1)) + S(uv + t * vec2f(1, 1));
  return vec4f(r / 16.0, 1.0);
}
@group(0) @binding(3) var bloomTex: texture_2d<f32>;
fn RRTAndODTFit(v: vec3f) -> vec3f { let a = v * (v + 0.0245786) - 0.000090537; let b = v * (0.983729 * v + 0.4329510) + 0.238081; return a / b; }
fn aces(c: vec3f) -> vec3f {
  let mi = mat3x3f(0.59719, 0.07600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);
  let mo = mat3x3f(1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602);
  return clamp(mo * RRTAndODTFit(mi * c), vec3f(0.0), vec3f(1.0));
}
fn toSRGB(c: vec3f) -> vec3f { return select(1.055 * pow(c, vec3f(1.0 / 2.4)) - 0.055, c * 12.92, c <= vec3f(0.0031308)); }
@fragment fn composite(i: O) -> @location(0) vec4f {
  let hdr = S(i.uv);
  let bl = textureSampleLevel(bloomTex, samp, i.uv, 0.0).rgb;
  var c = mix(hdr, bl, 0.05) * U.w;
  // gentle vignette
  let q = i.uv - 0.5; c *= 1.0 - dot(q, q) * 0.35;
  var o = toSRGB(aces(c));

  let px = i.pos.xy;
  let n1 = fract(sin(dot(px, vec2f(12.9898, 78.233))) * 43758.5453);
  let n2 = fract(sin(dot(px, vec2f(39.346, 11.135))) * 24634.6345);
  o += (n1 + n2 - 1.0) / 255.0;
  return vec4f(o, 1.0);
}
`;

// ---------------------------------------------------------------- CPU-side spectrum
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function lgamma(z) { // Lanczos
  const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  z -= 1; let x = c[0]; for (let i = 1; i < g + 2; i++) x += c[i] / (z + i);
  const t = z + g + 0.5; return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(x);
}
function jonswap(w, alpha, wp, gamma) {
  if (w <= 0) return 0;
  const sigma = w <= wp ? 0.07 : 0.09;
  const r = Math.exp(-((w - wp) ** 2) / (2 * sigma * sigma * wp * wp));
  return alpha * G * G / w ** 5 * Math.exp(-1.25 * (wp / w) ** 4) * gamma ** r;
}

// CPU transmittance along the sun direction (matches the LUT shader's medium)
function sunTransmittance(sun) {
  const RE = 6360e3, RA = 6460e3;
  const BR = [5.802e-6, 13.558e-6, 33.1e-6], BMe = 5.5e-6, BO = [0.65e-6, 1.881e-6, 0.085e-6];
  const o = [0, RE + 2, 0];
  const b = o[1] * sun[1], c = o[1] * o[1] - RA * RA, t = -b + Math.sqrt(b * b - c);
  const od = [0, 0, 0], S = 200;
  for (let i = 0; i < S; i++) {
    const tt = t * (i + 0.5) / S;
    const p = [sun[0] * tt, o[1] + sun[1] * tt, sun[2] * tt];
    const h = Math.hypot(p[0], p[1], p[2]) - RE;
    const dr = Math.exp(-h / 8000), dm = Math.exp(-h / 1200), dz = Math.max(0, 1 - Math.abs(h - 25000) / 15000);
    for (let k = 0; k < 3; k++) od[k] += (BR[k] * dr + BMe * dm + BO[k] * dz) * t / S;

}

  function ensureTargets() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = fixedW || Math.max(1, Math.round(canvas.clientWidth * dpr));
    const h = fixedH || Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (w === W && h === H && targets) return;
    W = w; H = h; canvas.width = w; canvas.height = h;
    if (targets) for (const t of targets.all) t.destroy();
    const msaaTex = device.createTexture({ size: [w, h], format: HDR, sampleCount: MSAA, usage: T.RENDER_ATTACHMENT });
    const depthTex = device.createTexture({ size: [w, h], format: 'depth32float', sampleCount: MSAA, usage: T.RENDER_ATTACHMENT });
    const hdrTex = device.createTexture({ size: [w, h], format: HDR, usage: T.RENDER_ATTACHMENT | T.TEXTURE_BINDING });
    const blooms = [];
    let bw = w, bh = h;
    for (let i = 0; i < 6; i++) { bw = Math.max(1, bw >> 1); bh = Math.max(1, bh >> 1); blooms.push({ tex: device.createTexture({ size: [bw, bh], format: HDR, usage: T.RENDER_ATTACHMENT | T.TEXTURE_BINDING }), w: bw, h: bh }); }
    const pu = (x, y, z, ww) => { const b = buf(16, U.UNIFORM | U.COPY_DST); device.queue.writeBuffer(b, 0, new Float32Array([x, y, z, ww])); return b; };
    const downs = blooms.map((b, i) => {
      const src = i === 0 ? { tex: hdrTex, w, h } : blooms[i - 1];
      return { target: b.tex.createView(), bg: device.createBindGroup({ layout: pDown.getBindGroupLayout(0), entries: [
        { binding: 0, resource: src.tex.createView() }, { binding: 1, resource: sClamp }, { binding: 2, resource: { buffer: pu(1 / src.w, 1 / src.h, i === 0 ? 1 : 0, 0) } }] }) };
    });
    const ups = [];
    for (let i = blooms.length - 1; i > 0; i--) {
      const src = blooms[i];
      ups.push({ target: blooms[i - 1].tex.createView(), bg: device.createBindGroup({ layout: pUp.getBindGroupLayout(0), entries: [
        { binding: 0, resource: src.tex.createView() }, { binding: 1, resource: sClamp }, { binding: 2, resource: { buffer: pu(1 / src.w, 1 / src.h, 0, 0) } }] }) });
    }
    const compU = buf(16, U.UNIFORM | U.COPY_DST);
    const compBG = device.createBindGroup({ layout: pComp.getBindGroupLayout(0), entries: [
      { binding: 0, resource: hdrTex.createView() }, { binding: 1, resource: sClamp }, { binding: 2, resource: { buffer: compU } }, { binding: 3, resource: blooms[0].tex.createView() }] });
    targets = { msaaView: msaaTex.createView(), depthView: depthTex.createView(), hdrView: hdrTex.createView(), downs, ups, compU, compBG, all: [msaaTex, depthTex, hdrTex, ...blooms.map((b) => b.tex)] };
  }

  // --- sun / sky (recomputed when the sun moves)
  let skyDirty = true, sunE = [1, 1, 1], ambient = [0, 0, 0], zenith = [0, 0, 0], sunDir = [0, 1, 0];
  const SUN_I = 22;
  function updateSky(enc) {
    const ce = Math.cos(state.sunEl);
    sunDir = [ce * Math.sin(state.sunAz), Math.sin(state.sunEl), -ce * Math.cos(state.sunAz)];
    const tr = sunTransmittance(sunDir);
    sunE = tr.map((t) => t * SUN_I);
    // crude sky irradiance/zenith estimates for clouds + water body (refined visually)
    const lift = Math.max(0.15, Math.min(1, sunDir[1] * 3 + 0.15));
    zenith = [0.16 * lift * SUN_I / 22, 0.30 * lift * SUN_I / 22, 0.62 * lift * SUN_I / 22];
    ambient = zenith.map((z) => z * Math.PI * 0.9);
    device.queue.writeBuffer(atmosU, 0, new Float32Array([...sunDir, SUN_I]));
    device.queue.writeBuffer(envU, 0, new Float32Array([...sunDir, 0, ...sunE, 0, ...zenith, state.cloud]));
    let p = enc.beginComputePass();
    p.setPipeline(pAtmos); p.setBindGroup(0, bgAtmos); p.dispatchWorkgroups(256 / 8, 128 / 8); p.end();
    p = enc.beginComputePass();
    p.setPipeline(pEnv); p.setBindGroup(0, bgEnv); p.dispatchWorkgroups(ENV_W / 8, ENV_H / 8); p.end();
    for (const j of envMipJobs) { p = enc.beginComputePass(); p.setPipeline(pMip); p.setBindGroup(0, j.bg); p.dispatchWorkgroups(Math.ceil(j.w / 8), Math.ceil(j.h / 8), 1); p.end(); }
    skyDirty = false;
  }

  // --- input
  const keys = new Set();
  let dragging = false, lx = 0, ly = 0;
  canvas.addEventListener('pointerdown', (e) => { dragging = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointerup', () => { dragging = false; });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const s = 0.0032 * (state.fovY / 1.0);
    state.yaw += (e.clientX - lx) * s; state.pitch = Math.max(-1.45, Math.min(1.45, state.pitch - (e.clientY - ly) * s));
    lx = e.clientX; ly = e.clientY;
  });
  canvas.addEventListener('wheel', (e) => { state.fovY = Math.max(0.25, Math.min(1.6, state.fovY * Math.exp(e.deltaY * 0.001))); e.preventDefault(); }, { passive: false });
  addEventListener('keydown', (e) => {
    keys.add(e.code);
    if(e.code==='Space'){state.paused=!state.paused;e.preventDefault();}
    if (e.code === 'KeyF') { state.mode = state.mode ? 0 : 1; if (!state.mode) state.flyY = Math.max(state.flyY, 6); }
    if (e.code === 'KeyH') { const h = document.getElementById('hud'); h.style.opacity = h.style.opacity === '0' ? '1' : '0'; }
    const vi = '12345'.indexOf(e.key); if (vi >= 0) applyView(VIEW_KEYS[vi]);
  });
  addEventListener('keyup', (e) => keys.delete(e.code));

  // --- capture (readback of the presented frame -> PNG -> POST /save)
  const captureQueue = [];
  let capturing = false;
  async function saveFrame(readBuf, bpr, w, h, name) {
    await readBuf.mapAsync(GPUMapMode.READ);
    const src = new Uint8Array(readBuf.getMappedRange());
    const img = new ImageData(w, h);
    const bgra = presentFormat === 'bgra8unorm';
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const s = y * bpr + x * 4, d = (y * w + x) * 4;
      img.data[d] = src[s + (bgra ? 2 : 0)]; img.data[d + 1] = src[s + 1]; img.data[d + 2] = src[s + (bgra ? 0 : 2)]; img.data[d + 3] = 255;
    }
    readBuf.unmap(); readBuf.destroy();
    const oc = new OffscreenCanvas(w, h); oc.getContext('2d').putImageData(img, 0, 0);
    const blob = await oc.convertToBlob({ type: 'image/jpeg', quality: 0.95 });
    try { console.log('Capture generated locally; upload disabled.',name,blob.size); }
    catch (err) { console.warn('capture not saved', err); }
  }

  // automated tour: ?tour=sun,side,away  (each view settles for `settle` frames, then is captured)
  const tour = Q.has('tour') ? Q.get('tour').split(',').filter((v) => VIEWS[v]) : [];
  const tourPrefix = Q.get('prefix') || 'shot';
  const settle = qn('settle', 150);
  let tourIdx = 0, tourFrames = 0;
  if (tour.length) applyView(tour[0]);
  if (tour.length) { document.getElementById('hud').style.opacity = '0'; }
  window.__tourDone = !tour.length;

  // debug: percentiles of the per-cascade Jacobian (wave folding) and foam coverage
  const half = (h) => { const s = h & 0x8000 ? -1 : 1, e = (h >> 10) & 31, m = h & 1023; return e === 0 ? s * m * 2 ** -24 : e === 31 ? NaN : s * (1 + m / 1024) * 2 ** (e - 15); };
  window.__jstats = async () => {
    const out = {};
    for (const [tex, ch, key] of [[varTex, 3, 'J'], [dispTex, 3, 'foam'], [dispTex, 1, 'h']]) {
      for (let c = 0; c < NUM_C; c++) {
        const rb = device.createBuffer({ size: N * N * 8, usage: U.COPY_DST | U.MAP_READ });
        const e = device.createCommandEncoder();
        e.copyTextureToBuffer({ texture: tex, origin: [0, 0, c] }, { buffer: rb, bytesPerRow: N * 8 }, [N, N, 1]);
        device.queue.submit([e.finish()]);
        await rb.mapAsync(GPUMapMode.READ);
        const u16 = new Uint16Array(rb.getMappedRange());
        const v = new Float32Array(N * N); for (let i = 0; i < N * N; i++) v[i] = half(u16[i * 4 + ch]);
        rb.unmap(); rb.destroy(); v.sort();
        const pc = (p) => +v[Math.floor(p * (v.length - 1))].toFixed(3);
        let m2 = 0; for (const x of v) m2 += x * x; out[`${key}${c}`] = { p1: pc(0.01), p5: pc(0.05), p20: pc(0.2), p50: pc(0.5), p95: pc(0.95), Hs: +(4 * Math.sqrt(m2 / v.length)).toFixed(3) };
      }
    }
    return out;
  };

  // --- frame loop
  const stats = document.getElementById('stats');
  let last = performance.now(), fpsAcc = 0, fpsN = 0;
  function frame(now) {
    const realDt=Math.max(.000001,(now-last)/1000);
    const dt=Math.min(.05,realDt);last=now;
    const simDt = tour.length ? 1 / 60 : dt;
    if(!state.paused)state.time += simDt;
    fpsAcc += realDt; fpsN++;
    if (fpsAcc > 0.5) { stats.textContent = `${(fpsN / fpsAcc).toFixed(0)} fps · ${W}×${H} · ${state.mode ? 'floating' : 'flying'} · sun ${(state.sunEl * 180 / Math.PI).toFixed(1)}°`; fpsAcc = 0; fpsN = 0; }

    // movement
    const sp = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 18 : 3.5) * dt;
    const fx = Math.sin(state.yaw), fz = -Math.cos(state.yaw);
    if (keys.has('KeyW')) { state.x += fx * sp; state.z += fz * sp; }
    if (keys.has('KeyS')) { state.x -= fx * sp; state.z -= fz * sp; }
    if (keys.has('KeyA')) { state.x += fz * sp; state.z -= fx * sp; }
    if (keys.has('KeyD')) { state.x -= fz * sp; state.z += fx * sp; }
    if (keys.has('KeyE')) { if (state.mode) state.height = Math.min(12, state.height + dt * 2); else state.flyY = Math.min(400, state.flyY + dt * Math.max(4, state.flyY)); }
    if (keys.has('KeyQ')) { if (state.mode) state.height = Math.max(0.6, state.height - dt * 2); else state.flyY = Math.max(1, state.flyY - dt * Math.max(4, state.flyY)); }
    if (keys.has('BracketRight')) { state.sunEl = Math.min(1.45, state.sunEl + dt * 0.15); skyDirty = true; }
    if (keys.has('BracketLeft')) { state.sunEl = Math.max(-0.02, state.sunEl - dt * 0.15); skyDirty = true; }
    if (keys.has('Period')) { state.sunAz += dt * 0.3; skyDirty = true; }
    if (keys.has('Comma')) { state.sunAz -= dt * 0.3; skyDirty = true; }

    state.x=Math.max(-45,Math.min(45,state.x));state.z=Math.max(-130,Math.min(130,state.z));
    ensureTargets();
    const enc = device.createCommandEncoder();
    if (skyDirty) updateSky(enc);

    // ocean simulation
    device.queue.writeBuffer(specU, 0, new Float32Array([state.time % LOOP_T, 2 * Math.PI / LOOP_T, 0, 0, ...CASCADE_L]));
    device.queue.writeBuffer(asmU, 0, new Float32Array([state.paused?0:simDt, state.chop, qn('foamThr', 0.775), 0]));
    let p = enc.beginComputePass();
    p.setPipeline(pSpec); p.setBindGroup(0, bgSpec); p.dispatchWorkgroups(N / 16, N / 16, NUM_C);
    p.setPipeline(pFftH); p.setBindGroup(0, bgFftH); p.dispatchWorkgroups(N, 1, NUM_C * 2);
    p.setPipeline(pFftV); p.setBindGroup(0, bgFftV); p.dispatchWorkgroups(N, 1, NUM_C * 2);
    p.setPipeline(pAsm); p.setBindGroup(0, bgAsm); p.dispatchWorkgroups(N / 16, N / 16, NUM_C);
    p.end();
    for (const j of mipJobs) { p = enc.beginComputePass(); p.setPipeline(pMip); p.setBindGroup(0, j.bg); p.dispatchWorkgroups(Math.ceil(j.w / 8), Math.ceil(j.h / 8), j.layers); p.end(); }

    // camera
    const tanY = Math.tan(state.fovY / 2);
    device.queue.writeBuffer(camU, 0, new Float32Array([state.x, state.z, state.yaw, state.pitch, state.height, state.mode, state.flyY, simDt, tanY, W / H, 0.05, state.reset, ...CASCADE_L]));
    state.reset = 0;
    p = enc.beginComputePass(); p.setPipeline(pCam); p.setBindGroup(0, bgCam); p.dispatchWorkgroups(1); p.end();

    // frame uniforms
    const gx=0,gz=0;
    device.queue.writeBuffer(frameU, 0, new Float32Array([
      ...sunDir, state.time, ...sunE, state.exposure, ...ambient, state.cloud, gx, gz, 0, state.chop,
      ...CASCADE_L, W, H, 1 / W, 1 / H, ...zenith, 0, qn('foam', 1.0), qn('capThr', 0.52), 0, 0,
    ]));

    // scene
    const rp = enc.beginRenderPass({
      colorAttachments: [{ view: targets.msaaView, resolveTarget: targets.hdrView, loadOp: 'clear', storeOp: 'discard', clearValue: [0, 0, 0, 1] }],
      depthStencilAttachment: { view: targets.depthView, depthLoadOp: 'clear', depthStoreOp: 'discard', depthClearValue: 0 },
    });
    rp.setBindGroup(0, bgRender);
    rp.setPipeline(pSky); rp.draw(3);
    rp.setPipeline(pScene);rp.setVertexBuffer(0,sceneVB);rp.setIndexBuffer(sceneIB,"uint32");rp.drawIndexed(scene.indices.length);
    rp.setPipeline(pWater); rp.setVertexBuffer(0, vbuf); rp.setIndexBuffer(ibuf, 'uint32'); rp.drawIndexed(grid.idx.length);
    rp.end();

    // bloom + tonemap
    for (const d of targets.downs) { const q = enc.beginRenderPass({ colorAttachments: [{ view: d.target, loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] }); q.setPipeline(pDown); q.setBindGroup(0, d.bg); q.draw(3); q.end(); }
    for (const u of targets.ups) { const q = enc.beginRenderPass({ colorAttachments: [{ view: u.target, loadOp: 'load', storeOp: 'store' }] }); q.setPipeline(pUp); q.setBindGroup(0, u.bg); q.draw(3); q.end(); }
    device.queue.writeBuffer(targets.compU, 0, new Float32Array([1 / W, 1 / H, 0, state.exposure]));
    const canvasTex = ctx.getCurrentTexture();
    const q = enc.beginRenderPass({ colorAttachments: [{ view: canvasTex.createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
    q.setPipeline(pComp); q.setBindGroup(0, targets.compBG); q.draw(3); q.end();

    // tour bookkeeping + capture
    let capName = null;
    if (tour.length && tourIdx < tour.length) {
      tourFrames++;
      if (tourFrames === settle) capName = `${tourPrefix}-${tour[tourIdx]}`;
    }
    if (!capName && captureQueue.length && !capturing) capName = captureQueue.shift();
    let readBuf = null, bpr = 0;
    if (capName) {
      bpr = Math.ceil(W * 4 / 256) * 256;
      readBuf = device.createBuffer({ size: bpr * H, usage: U.COPY_DST | U.MAP_READ });
      enc.copyTextureToBuffer({ texture: canvasTex }, { buffer: readBuf, bytesPerRow: bpr }, [W, H]);
    }
    device.queue.submit([enc.finish()]);
    if (capName) {
      capturing = true;
      const name = capName, w = W, h = H;
      saveFrame(readBuf, bpr, w, h, name).finally(() => {
        capturing = false;
        if (tour.length && name.startsWith(tourPrefix + '-')) {
          tourIdx++; tourFrames = 0;
          if (tourIdx < tour.length) applyView(tour[tourIdx]); else window.__tourDone = true;
        }
      });
      if (tour.length) tourFrames = -1e9; // pause counting until saved
    }
    schedule(safeFrame);
  }
  const schedule = (tour.length || Q.has("timer")) ? (f) => device.queue.onSubmittedWorkDone().then(() => setTimeout(() => f(performance.now()), 0)) : (f) => requestAnimationFrame(f);
  const safeFrame = (t) => { try { frame(t); } catch (e) { fail('frame error: '+String(e && e.stack || e)); } };
  schedule(safeFrame);
}

main().catch((e) => fail(String(e && e.stack || e)));

</script>
